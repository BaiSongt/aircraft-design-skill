<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Design Visualizer</title>
  <style>
    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #111820;
      --bg-tertiary: #0d1218;
      --bg-hover: #1a2532;
      --bg-active: #243447;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #f0f4f8;
      --text-secondary: #8b9bb4;
      --text-muted: #5a6b7c;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: rgba(59,130,246,0.15);
      --success: #10b981;
      --success-light: rgba(16,185,129,0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245,158,11,0.15);
      --danger: #ef4444;
      --danger-light: rgba(239,68,68,0.15);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      background: var(--bg-primary);
    }

    #sidebar {
      background: var(--bg-secondary);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .sidebar-header p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 3px;
    }

    .section {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      background: var(--bg-tertiary);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .section:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
      letter-spacing: 0.2px;
    }

    .section-toggle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: var(--transition);
    }

    .section-toggle:hover {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }

    .section.collapsed .section-content {
      display: none;
    }

    .section.collapsed .section-toggle {
      transform: rotate(-90deg);
    }

    .section-content {
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .row input[type="text"],
    .row input[type="number"] {
      flex: 1;
      min-width: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      outline: none;
      font-size: 13px;
      transition: var(--transition);
    }

    .row input[type="text"]:focus,
    .row input[type="number"]:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .row input[type="text"]::placeholder,
    .row input[type="number"]::placeholder {
      color: var(--text-muted);
    }

    .row button {
      background: var(--accent-primary);
      color: #fff;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .row button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .row button:active {
      transform: translateY(0);
    }

    .row button.secondary {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }

    .row button.secondary:hover {
      background: var(--bg-active);
      color: var(--text-primary);
    }

    .row button.icon-btn {
      padding: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-primary);
      cursor: pointer;
    }

    .row input[type="range"] {
      flex: 1;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    .row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent-primary);
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
    }

    .row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      box-shadow: 0 0 0 4px var(--accent-light);
    }

    .row small {
      color: var(--text-muted);
      font-size: 12px;
    }

    a {
      color: var(--accent-primary);
      text-decoration: none;
      font-size: 13px;
      transition: var(--transition);
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .chip.success {
      background: var(--success-light);
      color: var(--success);
    }

    .chip.warning {
      background: var(--warning-light);
      color: var(--warning);
    }

    .chip.error {
      background: var(--danger-light);
      color: var(--danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--bg-primary);
    }

    tr:hover td {
      background: var(--bg-hover);
    }

    .muted {
      color: var(--text-muted);
    }

    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .list label {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      transition: var(--transition);
    }

    .list label:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }

    .list input[type="checkbox"] {
      width: 14px;
      height: 14px;
    }

    #viewer {
      position: relative;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }

    .viewer-toolbar-left,
    .viewer-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .toolbar-btn {
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-btn:hover {
      background: var(--bg-active);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .toolbar-btn.active {
      background: var(--accent-light);
      color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .view-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .view {
      position: relative;
      background: var(--bg-primary);
      overflow: hidden;
    }

    .view canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .view-label {
      position: absolute;
      left: 12px;
      top: 12px;
      background: rgba(10, 14, 20, 0.85);
      backdrop-filter: blur(8px);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      z-index: 10;
      border: 1px solid var(--border);
    }

    .view-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .view-btn {
      width: 32px;
      height: 32px;
      background: rgba(10, 14, 20, 0.85);
      backdrop-filter: blur(8px);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .view-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .view-btn:active {
      transform: scale(0.95);
    }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
    }

    #candidate-table tr {
      cursor: pointer;
      transition: var(--transition);
    }

    #candidate-table tr:hover {
      background: var(--bg-hover);
    }

    .field-invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px var(--danger-light);
    }

    .validation-ok {
      color: var(--success);
      font-size: 12px;
      padding: 8px;
      background: var(--success-light);
      border-radius: var(--radius-sm);
    }

    .validation-warn {
      color: var(--warning);
      font-size: 12px;
      padding: 8px;
      background: var(--warning-light);
      border-radius: var(--radius-sm);
    }

    .validation-error {
      color: var(--danger);
      font-size: 12px;
      padding: 8px;
      background: var(--danger-light);
      border-radius: var(--radius-sm);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      #app {
        grid-template-columns: 280px 1fr;
      }
    }

    @media (max-width: 768px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      #sidebar {
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .view-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">
        <h1>Design Visualizer</h1>
        <p>飞机设计可视化工具</p>
      </div>
      <div class="sidebar-content">
        <div class="section" data-section="data">
          <div class="section-header">
            <h3 class="section-title">数据加载</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <div class="row">
              <button id="btn-reload">重新加载</button>
              <span class="chip" id="load-state">未加载</span>
            </div>
            <div class="row">
              <input id="path-run" type="text" placeholder="./run_YYYYMMDD_HHMMSS"/>
            </div>
            <div class="row">
              <input id="path-results" type="text" value="./results/results.json"/>
            </div>
            <div class="row">
              <input id="path-mesh" type="text" value="./mesh/geometry_mesh.json"/>
            </div>
            <div class="row">
              <input id="path-report" type="text" value="./report/report.md"/>
            </div>
            <div class="row">
              <input id="path-constraints" type="text" value="./report/constraints_ws_tw.svg"/>
            </div>
            <div class="row">
              <input id="path-advanced" type="text" value="./geometry/advanced_shape_results.json"/>
            </div>
            <div class="row">
              <input id="path-openvsp" type="text" value="./openvsp/openvsp_advanced.py"/>
            </div>
            <div class="divider"></div>
            <div class="row">
              <label>results.json</label>
              <input id="file-results" type="file" accept=".json"/>
            </div>
            <div class="row">
              <label>geometry_mesh.json</label>
              <input id="file-mesh" type="file" accept=".json"/>
            </div>
            <div class="row">
              <label>advanced_shape_results.json</label>
              <input id="file-advanced" type="file" accept=".json"/>
            </div>
            <div id="status"></div>
          </div>
        </div>

        <div class="section" data-section="display">
          <div class="section-header">
            <h3 class="section-title">显示控制</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <div class="row">
              <label><input id="toggle-grid" type="checkbox" checked/>网格</label>
              <label><input id="toggle-wire" type="checkbox"/>线框</label>
            </div>
            <div class="row">
              <span class="muted">缩放</span>
              <input id="scale" type="range" min="0.2" max="3" step="0.05" value="1"/>
              <span class="muted" id="scale-value">1.0x</span>
            </div>
            <div class="row">
              <span class="muted">炸开</span>
              <input id="explode" type="range" min="0" max="5" step="0.1" value="0"/>
              <span class="muted" id="explode-value">0.0</span>
            </div>
            <div class="divider"></div>
            <div class="row">
              <small>部件列表</small>
            </div>
            <div class="list" id="parts-list"></div>
          </div>
        </div>

        <div class="section" data-section="targets">
          <div class="section-header">
            <h3 class="section-title">设计目标</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <table id="tbl-targets"></table>
          </div>
        </div>

        <div class="section" data-section="params">
          <div class="section-header">
            <h3 class="section-title">参数化设计</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <div id="param-controls"></div>
            <div class="row" style="margin-top:12px;">
              <button id="btn-reset-params" class="secondary">恢复计算结果</button>
            </div>
            <table id="tbl-params"></table>
            <div id="param-validation" style="margin-top:12px;"></div>
          </div>
        </div>

        <div class="section" data-section="results">
          <div class="section-header">
            <h3 class="section-title">计算结果</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <table id="tbl-results"></table>
          </div>
        </div>

        <div class="section" data-section="candidates">
          <div class="section-header">
            <h3 class="section-title">设计点候选</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <table id="tbl-candidates"></table>
            <div style="margin-top:12px;">
              <div class="row">
                <small>选中候选</small>
              </div>
              <table id="tbl-candidate-detail"></table>
            </div>
          </div>
        </div>

        <div class="section" data-section="reports">
          <div class="section-header">
            <h3 class="section-title">报告与图表</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <div class="row">
              <a id="link-report" href="#" target="_blank">📄 report.md</a>
            </div>
            <div class="row">
              <a id="link-constraints" href="#" target="_blank">📊 constraints_ws_tw.svg</a>
            </div>
          </div>
        </div>

        <div class="section" data-section="geometry">
          <div class="section-header">
            <h3 class="section-title">几何参数</h3>
            <span class="section-toggle">▼</span>
          </div>
          <div class="section-content">
            <div id="geometry-controls"></div>
            <div class="row" style="margin-top:12px;">
              <button id="btn-apply-geometry">应用几何</button>
              <button id="btn-reset-geometry" class="secondary">恢复几何</button>
            </div>
            <div class="row">
              <button id="btn-download-geometry" class="secondary">下载几何参数</button>
              <span class="muted" id="geometry-status"></span>
            </div>
            <table id="tbl-geometry"></table>
            <div class="divider"></div>
            <div class="row">
              <a id="link-openvsp" href="#" target="_blank">🐍 openvsp_advanced.py</a>
            </div>
            <div class="row">
              <button id="btn-openvsp" class="secondary">下载 OpenVSP 脚本</button>
              <span class="muted" id="openvsp-status"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="viewer">
      <div class="viewer-toolbar">
        <div class="viewer-toolbar-left">
          <span class="viewer-title">3D 视图</span>
        </div>
        <div class="viewer-toolbar-right">
          <button class="toolbar-btn" id="btn-reset-all-views">⟲ 重置所有视图</button>
          <button class="toolbar-btn" id="btn-fit-view">⤡ 适应视图</button>
          <button class="toolbar-btn" id="btn-toggle-grid">⊞ 网格</button>
          <button class="toolbar-btn" id="btn-toggle-wire">▦ 线框</button>
        </div>
      </div>
      <div class="view-grid">
        <div class="view" data-view="top">
          <div class="view-label">Top (X-Y)</div>
          <div class="view-controls">
            <button class="view-btn" data-action="reset" title="重置视图">⟲</button>
            <button class="view-btn" data-action="zoom-in" title="放大">+</button>
            <button class="view-btn" data-action="zoom-out" title="缩小">−</button>
          </div>
          <canvas id="cv_top"></canvas>
        </div>
        <div class="view" data-view="side">
          <div class="view-label">Side (X-Z)</div>
          <div class="view-controls">
            <button class="view-btn" data-action="reset" title="重置视图">⟲</button>
            <button class="view-btn" data-action="zoom-in" title="放大">+</button>
            <button class="view-btn" data-action="zoom-out" title="缩小">−</button>
          </div>
          <canvas id="cv_side"></canvas>
        </div>
        <div class="view" data-view="front">
          <div class="view-label">Front (Y-Z)</div>
          <div class="view-controls">
            <button class="view-btn" data-action="reset" title="重置视图">⟲</button>
            <button class="view-btn" data-action="zoom-in" title="放大">+</button>
            <button class="view-btn" data-action="zoom-out" title="缩小">−</button>
          </div>
          <canvas id="cv_front"></canvas>
        </div>
        <div class="view" data-view="iso">
          <div class="view-label">Iso (3D)</div>
          <div class="view-controls">
            <button class="view-btn" data-action="reset" title="重置视图">⟲</button>
            <button class="view-btn" data-action="zoom-in" title="放大">+</button>
            <button class="view-btn" data-action="zoom-out" title="缩小">−</button>
            <button class="view-btn" data-action="auto-rotate" title="自动旋转">↻</button>
          </div>
          <canvas id="cv_iso"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ui = {
      loadState: document.getElementById("load-state"),
      status: document.getElementById("status"),
      pathResults: document.getElementById("path-results"),
      pathMesh: document.getElementById("path-mesh"),

    function setStatus(text, ok) {
      ui.status.textContent = text || "";
      ui.loadState.textContent = ok ? "已加载" : "未加载";
      ui.loadState.className = "chip " + (ok ? "success" : "");
    }

    function fmt(v) {
      if (typeof v === "number" && Number.isFinite(v)) {
        const abs = Math.abs(v);
        if (abs >= 1000 || abs === 0) return v.toFixed(2);
        if (abs >= 1) return v.toFixed(4);
        return v.toExponential(3);
      }
      if (typeof v === "string") return v;
      if (typeof v === "boolean") return v ? "true" : "false";
      return "";
    }

    function getByPath(obj, path) {
      if (!obj) return undefined;
      const parts = path.split(".");
      let cur = obj;
      for (const p of parts) {
        if (cur && typeof cur === "object" && p in cur) cur = cur[p];
        else return undefined;
      }
      return cur;
    }

    function setByPath(obj, path, value) {
      if (!obj) return false;
      const parts = path.split(".");
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i += 1) {
        const p = parts[i];
        if (!cur[p] || typeof cur[p] !== "object") cur[p] = {};
        cur = cur[p];
      }
      cur[parts[parts.length - 1]] = value;
      return true;
    }

    function cloneJson(obj) {
      if (!obj) return null;
      return JSON.parse(JSON.stringify(obj));
    }

    function getGeometryRoot(advanced) {
      if (!advanced) return null;
      return advanced?.inputs?.geometry_shape || advanced?.geometry_processed?.raw || advanced?.geometry_shape || null;
    }

    function buildEditableAdvanced(advanced) {
      if (!advanced) return null;
      const base = cloneJson(advanced);
      if (base.inputs && base.inputs.geometry_shape) return base;
      const geo = getGeometryRoot(base);
      if (!geo) return base;
      if (!base.inputs) base.inputs = {};
      if (!base.inputs.geometry_shape) base.inputs.geometry_shape = cloneJson(geo);
      return base;
    }

    function renderTable(el, rows, headers) {
      if (!rows || rows.length === 0) {
        el.innerHTML = "<tr><td class='muted' colspan='" + (headers ? headers.length : 2) + "'>无数据</td></tr>";
        return;
      }
      const head = headers ? "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>" : "";
      const body = rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("");
      el.innerHTML = head + body;
    }

    function flattenNumeric(obj, prefix) {
      const rows = [];
      if (!obj || typeof obj !== "object") return rows;
      const keys = Object.keys(obj);
      for (const k of keys) {
        const v = obj[k];
        if (typeof v === "number" || typeof v === "string" || typeof v === "boolean") {
          rows.push([prefix ? `${prefix}.${k}` : k, fmt(v)]);
        }
      }
      return rows;
    }

    function flattenNumericDeep(obj, prefix, rows, depth, maxItems) {
      if (!rows) return [];
      if (!obj || typeof obj !== "object") return rows;
      if (rows.length >= maxItems) return rows;
      if (depth <= 0) return rows;
      if (Array.isArray(obj)) {
        obj.forEach((item, idx) => {
          if (rows.length >= maxItems) return;
          flattenNumericDeep(item, `${prefix}[${idx}]`, rows, depth - 1, maxItems);
        });
        return rows;
      }
      Object.keys(obj).forEach(k => {
        if (rows.length >= maxItems) return;
        const v = obj[k];
        const path = prefix ? `${prefix}.${k}` : k;
        if (typeof v === "number" || typeof v === "string" || typeof v === "boolean") {
          rows.push([path, fmt(v)]);
        } else if (typeof v === "object") {
          flattenNumericDeep(v, path, rows, depth - 1, maxItems);
        }
      });
      return rows;
    }

    async function loadScript(src) {
      return new Promise(resolve => {
        if (!src) return resolve(false);
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    }

    async function ensureThree() {
      if (window.THREE) return true;
      await loadScript("./three.min.js");
      if (window.THREE && !window.THREE.OrbitControls) await loadScript("./OrbitControls.js");
      if (window.THREE) return true;
      await loadScript("https://unpkg.com/three@0.160.0/build/three.min.js");
      await loadScript("https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js");
      return !!window.THREE;
    }

    function clearScene() {
      if (!state.group) return;
      state.meshes.forEach(m => {
        if (m.geometry) m.geometry.dispose();
        if (m.material) m.material.dispose();
      });
      state.meshes = [];
      state.group.clear();
    }

    function buildScene(parts) {
      if (!window.THREE) return;
      if (!state.scene) {
        state.scene = new THREE.Scene();
        state.scene.background = new THREE.Color(0x0a0e14);
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(12, -16, 20);
        state.scene.add(ambient);
        state.scene.add(dir);
        state.group = new THREE.Group();
        state.scene.add(state.group);
        state.grid = new THREE.GridHelper(200, 40, 0x2f3b52, 0x1c2433);
        state.axes = new THREE.AxesHelper(30);
        state.scene.add(state.grid);
        state.scene.add(state.axes);
      }

      clearScene();
      const group = state.group;
      parts.forEach((p, idx) => {
        const geo = new THREE.BufferGeometry();
        const vertices = Array.isArray(p.vertices) ? p.vertices : [];
        const indices = Array.isArray(p.indices) ? p.indices : [];
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(vertices), 3));
        if (indices.length > 0) {
          let maxIndex = 0;
          for (let i = 0; i < indices.length; i += 1) {
            const v = indices[i];
            if (v > maxIndex) maxIndex = v;
          }
          const IndexArray = maxIndex > 65535 ? Uint32Array : Uint16Array;
          geo.setIndex(new THREE.BufferAttribute(new IndexArray(indices), 1));
        }
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(p.color || "#cccccc"),
          metalness: 0.1,
          roughness: 0.8,
          side: THREE.DoubleSide,
          wireframe: ui.toggleWire.checked
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData.partIndex = idx;
        mesh.name = p.name;
        group.add(mesh);
        state.meshes.push(mesh);
      });

      const box = new THREE.Box3();
      state.meshes.forEach(m => box.expandByObject(m));
      state.bounds = box.isEmpty() ? null : box;
      if (state.bounds) {
        const center = new THREE.Vector3();
        state.bounds.getCenter(center);
        group.position.sub(center);
      }
      applyTransforms();
      fitCameras();
    }

    function applyTransforms() {
      if (!state.group) return;
      const scale = parseFloat(ui.scale.value);
      const explode = parseFloat(ui.explode.value);
      const gs = state.geometryScale || { x: 1, y: 1, z: 1 };
      state.group.scale.set(scale * gs.x, scale * gs.y, scale * gs.z);
      const n = state.meshes.length;
      const mid = (n - 1) * 0.5;
      state.meshes.forEach((m, i) => {
        const offset = (i - mid) * explode;
        m.position.set(offset, 0, 0);
      });
      if (state.grid) state.grid.visible = ui.toggleGrid.checked;
      if (state.axes) state.axes.visible = ui.toggleGrid.checked;
      state.meshes.forEach(m => {
        if (m.material) m.material.wireframe = ui.toggleWire.checked;
      });
    }

    function fitCameras() {
      if (!state.bounds || !window.THREE) return;
      const size = new THREE.Vector3();
      state.bounds.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z, 1);
      const dist = maxDim * 2.2;

      const makeOrtho = () => new THREE.OrthographicCamera(-maxDim, maxDim, maxDim, -maxDim, 0.01, 1e6);
      if (!state.cameras) {
        state.cameras = {
          top: makeOrtho(),
          side: makeOrtho(),
          front: makeOrtho(),
          iso: new THREE.PerspectiveCamera(40, 1, 0.01, 1e6)
        };
      }
      const { top, side, front, iso } = state.cameras;
      top.position.set(0, 0, dist);
      top.up.set(0, 1, 0);
      top.lookAt(0, 0, 0);
      side.position.set(0, dist, 0);
      side.up.set(0, 0, 1);
      side.lookAt(0, 0, 0);
      front.position.set(dist, 0, 0);
      front.up.set(0, 0, 1);
      front.lookAt(0, 0, 0);

      iso.position.set(dist, -dist, dist);
      iso.lookAt(0, 0, 0);
      iso.updateProjectionMatrix();

      updateRendererSize();
    }

    function updateRendererSize() {
      if (!state.renderers) return;
      const rect = ui.canvases.iso.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      for (const k of Object.keys(state.renderers)) {
        state.renderers[k].setSize(w, h, false);
      }
      if (state.cameras) {
        const { top, side, front, iso } = state.cameras;
        const aspect = w / Math.max(1, h);
        [top, side, front].forEach(c => {
          c.left = -c.right * aspect;
          c.right = -c.left;
          c.top = c.right;
          c.bottom = -c.top;
          c.updateProjectionMatrix();
        });
        iso.aspect = aspect;
        iso.updateProjectionMatrix();
      }
    }

    function zoomCamera(viewType, direction) {
      if (!state.cameras || !state.bounds) return;
      const camera = state.cameras[viewType];
      if (!camera) return;
      
      const zoomFactor = direction === 'in' ? 0.9 : 1.1;
      state.cameraZoom[viewType] *= zoomFactor;
      state.cameraZoom[viewType] = Math.max(0.1, Math.min(5, state.cameraZoom[viewType]));
      
      if (camera.isOrthographicCamera) {
        camera.zoom = state.cameraZoom[viewType];
        camera.updateProjectionMatrix();
      } else {
        const size = new THREE.Vector3();
        state.bounds.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z, 1);
        const dist = maxDim * 2.2 / state.cameraZoom[viewType];
        camera.position.normalize().multiplyScalar(dist);
      }
    }

    function resetCamera(viewType) {
      if (!state.cameras || !state.bounds) return;
      state.cameraZoom[viewType] = 1;
      fitCameras();
      
      if (state.controls && viewType === 'iso') {
        state.controls.reset();
      }
    }

    function toggleAutoRotate() {
      if (!state.controls) return;
      state.autoRotate = !state.autoRotate;
      state.controls.autoRotate = state.autoRotate;
      state.controls.autoRotateSpeed = 2.0;
      
      const btn = document.querySelector('.view[data-view="iso"] .view-btn[data-action="auto-rotate"]');
      if (btn) {
        btn.classList.toggle('active', state.autoRotate);
      }
    }

    function resetAllViews() {
      ['top', 'side', 'front', 'iso'].forEach(viewType => {
        resetCamera(viewType);
      });
      state.autoRotate = false;
      if (state.controls) {
        state.controls.autoRotate = false;
      }
      const autoRotateBtn = document.querySelector('.view[data-view="iso"] .view-btn[data-action="auto-rotate"]');
      if (autoRotateBtn) {
        autoRotateBtn.classList.remove('active');
      }
    }

    function renderLoop() {
      if (!state.renderers || !state.cameras || !state.scene) return;
      state.renderers.top.render(state.scene, state.cameras.top);
      state.renderers.side.render(state.scene, state.cameras.side);
      state.renderers.front.render(state.scene, state.cameras.front);
      state.renderers.iso.render(state.scene, state.cameras.iso);
      requestAnimationFrame(renderLoop);
    }

    function ensureRenderers() {
      if (!window.THREE) return;
      if (!state.renderers) {
        state.renderers = {
          top: new THREE.WebGLRenderer({ canvas: ui.canvases.top, antialias: true }),
          side: new THREE.WebGLRenderer({ canvas: ui.canvases.side, antialias: true }),
          front: new THREE.WebGLRenderer({ canvas: ui.canvases.front, antialias: true }),
          iso: new THREE.WebGLRenderer({ canvas: ui.canvases.iso, antialias: true })
        };
        Object.values(state.renderers).forEach(r => {
          r.setPixelRatio(window.devicePixelRatio || 1);
        });
        if (window.THREE.OrbitControls) {
          state.controls = new THREE.OrbitControls(state.cameras.iso, ui.canvases.iso);
          state.controls.enableDamping = true;
          state.controls.dampingFactor = 0.05;
        }
        renderLoop();
      }
    }

    function renderPartsList(parts) {
      if (!parts || parts.length === 0) {
        ui.partsList.innerHTML = "<span class='muted'>无部件</span>";
        return;
      }
      ui.partsList.innerHTML = "";
      parts.forEach((p, idx) => {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.onchange = () => {
          const mesh = state.meshes[idx];
          if (mesh) mesh.visible = cb.checked;
        };
        const tag = document.createElement("span");
        tag.textContent = p.name || `part_${idx}`;
        label.appendChild(cb);
        label.appendChild(tag);
        ui.partsList.appendChild(label);
      });
    }

    function renderTargets(results) {
      const targets = [];
      const cInputs = results && results.constraints ? results.constraints.inputs : null;
      if (cInputs) targets.push(...flattenNumeric(cInputs, "constraints"));
      const mission = results ? results.mission : null;
      if (mission) targets.push(...flattenNumeric(mission, "mission"));
      renderTable(ui.tblTargets, targets, ["字段", "值"]);
    }

    function getGeometryMetrics(geo) {
      if (!geo) return null;
      const fuselageLength = Number(getByPath(geo, "fuselage.axis.length_m"));
      let fuselageRadius = Number(getByPath(geo, "fuselage.profile.max_radius_m"));
      if (!Number.isFinite(fuselageRadius)) {
        const ry = Number(getByPath(geo, "fuselage.profile.max_radius_y_m"));
        const rz = Number(getByPath(geo, "fuselage.profile.max_radius_z_m"));
        fuselageRadius = Math.max(Number.isFinite(ry) ? ry : 0, Number.isFinite(rz) ? rz : 0);
      }
      const wingArea = Number(getByPath(geo, "wing.planform.s_ref_m2"));
      const wingAR = Number(getByPath(geo, "wing.planform.aspect_ratio"));
      let wingSpan = null;
      if (Number.isFinite(wingArea) && Number.isFinite(wingAR) && wingArea > 0 && wingAR > 0) {
        wingSpan = Math.sqrt(wingArea * wingAR);
      }
      let wingChord = null;
      if (Number.isFinite(wingArea) && Number.isFinite(wingSpan) && wingSpan > 0) {
        wingChord = wingArea / wingSpan;
      }
      return { fuselageLength, fuselageRadius, wingArea, wingAR, wingSpan, wingChord };
    }

    function buildGeometrySchema(geo) {
      if (!geo) return [];
      const schema = [];
      if (Number.isFinite(Number(getByPath(geo, "fuselage.axis.length_m")))) {
        schema.push({ path: "inputs.geometry_shape.fuselage.axis.length_m", label: "机身长度 L (m)", min: 2, max: 80, step: 0.1 });
      }
      if (Number.isFinite(Number(getByPath(geo, "fuselage.profile.max_radius_m")))) {
        schema.push({ path: "inputs.geometry_shape.fuselage.profile.max_radius_m", label: "机身最大半径 R (m)", min: 0.1, max: 8, step: 0.05 });
      } else if (Number.isFinite(Number(getByPath(geo, "fuselage.profile.max_radius_y_m")))) {
        schema.push({ path: "inputs.geometry_shape.fuselage.profile.max_radius_y_m", label: "机身最大半径 Y (m)", min: 0.1, max: 8, step: 0.05 });
      } else if (Number.isFinite(Number(getByPath(geo, "fuselage.profile.max_radius_z_m")))) {
        schema.push({ path: "inputs.geometry_shape.fuselage.profile.max_radius_z_m", label: "机身最大半径 Z (m)", min: 0.1, max: 8, step: 0.05 });
      }
      if (Number.isFinite(Number(getByPath(geo, "wing.planform.s_ref_m2")))) {
        schema.push({ path: "inputs.geometry_shape.wing.planform.s_ref_m2", label: "机翼面积 S (m²)", min: 1, max: 600, step: 0.5 });
      }
      if (Number.isFinite(Number(getByPath(geo, "wing.planform.aspect_ratio")))) {
        schema.push({ path: "inputs.geometry_shape.wing.planform.aspect_ratio", label: "机翼展弦比 AR", min: 4, max: 25, step: 0.1 });
      }
      if (Number.isFinite(Number(getByPath(geo, "wing.planform.taper_ratio")))) {
        schema.push({ path: "inputs.geometry_shape.wing.planform.taper_ratio", label: "机翼梢根比", min: 0.2, max: 1.2, step: 0.05 });
      }
      if (Number.isFinite(Number(getByPath(geo, "wing.planform.sweep_quarter_chord_deg")))) {
        schema.push({ path: "inputs.geometry_shape.wing.planform.sweep_quarter_chord_deg", label: "机翼后掠 (deg)", min: -10, max: 60, step: 0.5 });
      }
      if (Number.isFinite(Number(getByPath(geo, "wing.planform.dihedral_deg")))) {
        schema.push({ path: "inputs.geometry_shape.wing.planform.dihedral_deg", label: "机翼上反角 (deg)", min: -10, max: 20, step: 0.5 });
      }
      return schema;
    }

    function setupGeometryControls(advancedEditable) {
      const geo = advancedEditable?.inputs?.geometry_shape || null;
      ui.geometryControls.innerHTML = "";
      if (!geo) {
        ui.geometryControls.innerHTML = "<span class='muted'>无可编辑几何</span>";
        renderGeometrySummary();
        return;
      }
      const schema = buildGeometrySchema(geo);
      schema.forEach(p => {
        const val = getByPath(advancedEditable, p.path);
        if (!Number.isFinite(Number(val))) return;
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("span");
        label.className = "muted";
        label.textContent = p.label;
        const input = document.createElement("input");
        input.type = "number";
        input.min = String(p.min);
        input.max = String(p.max);
        input.step = String(p.step);
        input.value = String(val);
        input.oninput = () => {
          updateGeometryValue(p.path, parseFloat(input.value));
        };
        row.appendChild(label);
        row.appendChild(input);
        ui.geometryControls.appendChild(row);
      });
      renderGeometrySummary();
    }

    function updateGeometryValue(path, value) {
      if (!Number.isFinite(value) || !state.advancedEditable) return;
      setByPath(state.advancedEditable, path, value);
      ui.geometryStatus.textContent = "已更新";
      renderGeometrySummary();
      updateGeometryScale();
    }

    function updateGeometryScale() {
      const geo = state.advancedEditable?.inputs?.geometry_shape || null;
      const base = state.geometryBaseline;
      const cur = getGeometryMetrics(geo);
      if (!base || !cur) return;
      let sx = 1;
      let sy = 1;
      let sz = 1;
      if (Number.isFinite(base.fuselageLength) && base.fuselageLength > 0 && Number.isFinite(cur.fuselageLength)) {
        sx = cur.fuselageLength / base.fuselageLength;
      }
      if (Number.isFinite(base.wingSpan) && base.wingSpan > 0 && Number.isFinite(cur.wingSpan)) {
        sy = cur.wingSpan / base.wingSpan;
      }
      if (Number.isFinite(base.fuselageRadius) && base.fuselageRadius > 0 && Number.isFinite(cur.fuselageRadius)) {
        sz = cur.fuselageRadius / base.fuselageRadius;
      }
      state.geometryScale = { x: sx, y: sy, z: sz };
      applyTransforms();
      fitCameras();
    }

    function renderGeometrySummary() {
      const geo = state.advancedEditable?.inputs?.geometry_shape || state.advanced?.inputs?.geometry_shape || null;
      if (!geo) {
        renderTable(ui.tblGeometry, [], ["字段", "值"]);
        return;
      }
      const m = getGeometryMetrics(geo);
      const rows = [
        ["fuselage_length_m", "机身长度", fmt(m?.fuselageLength)],
        ["fuselage_radius_m", "机身半径", fmt(m?.fuselageRadius)],
        ["wing_area_m2", "机翼面积", fmt(m?.wingArea)],
        ["wing_aspect_ratio", "机翼展弦比", fmt(m?.wingAR)],
        ["wing_span_m", "机翼展长", fmt(m?.wingSpan)],
        ["wing_chord_m", "机翼平均弦长", fmt(m?.wingChord)]
      ].filter(r => r[2] !== "");
      renderTable(ui.tblGeometry, rows, ["字段", "说明", "值"]);
    }

    function downloadJson(data, filename) {
      if (!data) return;
      const text = JSON.stringify(data, null, 2);
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderResults(results) {
      const rows = [];
      const sections = [
        ["sizing", results?.sizing],
        ["weights", results?.weights],
        ["aero", results?.aero],
        ["performance", results?.performance],
        ["stability", results?.stability],
        ["structures", results?.structures],
        ["propulsion", results?.propulsion]
      ];
      sections.forEach(([name, obj]) => {
        if (obj) rows.push(...flattenNumeric(obj, name));
      });
      renderTable(ui.tblResults, rows, ["字段", "值"]);
    }

    function renderCandidates(results) {
      const list = results?.design_loop?.top_candidates || results?.design_loop?.candidates || [];
      if (!Array.isArray(list) || list.length === 0) {
        renderTable(ui.tblCandidates, [], ["序号", "W/S", "AR", "T/W", "Score", "Feasible"]);
        renderTable(ui.tblCandidateDetail, [], ["字段", "值"]);
        return;
      }
      const rows = list.map((c, i) => [
        String(i + 1),
        fmt(c.wing_loading_pa),
        fmt(c.aspect_ratio),
        fmt(c.thrust_to_weight),
        fmt(c.score),
        c.feasible ? "true" : "false"
      ]);
      renderTable(ui.tblCandidates, rows, ["序号", "W/S", "AR", "T/W", "Score", "Feasible"]);
      const trs = ui.tblCandidates.querySelectorAll("tr");
      trs.forEach((tr, i) => {
        if (i === 0) return;
        tr.onclick = () => {
          const c = list[i - 1];
          applyCandidate(c);
          const detail = [
            ["wing_loading_pa", fmt(c.wing_loading_pa)],
            ["aspect_ratio", fmt(c.aspect_ratio)],
            ["thrust_to_weight", fmt(c.thrust_to_weight)],
            ["score", fmt(c.score)],
            ["feasible", c.feasible ? "true" : "false"],
            ["driver", c.driver || ""],
            ["worst_margin", fmt(c.worst_margin)]
          ];
          renderTable(ui.tblCandidateDetail, detail, ["字段", "值"]);
        };
      });
      renderTable(ui.tblCandidateDetail, [], ["字段", "值"]);
    }

    function extractDefaultParameters(results) {
      const sizing = results?.design_loop?.best_sizing || results?.sizing || {};
      const stability = results?.stability || {};
      const structures = results?.structures || {};
      return {
        wing_loading_pa: sizing.wing_loading_pa ?? null,
        aspect_ratio: sizing.aspect_ratio ?? null,
        thrust_to_weight: sizing.thrust_to_weight ?? null,
        static_margin: stability.static_margin ?? null,
        n_limit: structures.n_limit ?? null
      };
    }

    function getParamSchema(results) {
      const smRisk = results?.inputs_config?.report?.risk_thresholds?.static_margin || null;
      return [
        { key: "wing_loading_pa", label: "翼载 W/S (Pa)", min: 200, max: 8000, step: 50 },
        { key: "aspect_ratio", label: "展弦比 AR", min: 4, max: 20, step: 0.1 },
        { key: "thrust_to_weight", label: "推重比 T/W", min: 0.05, max: 1.2, step: 0.01 },
        { key: "static_margin", label: "静稳定裕度", min: 0.0, max: 0.4, step: 0.01, risk: smRisk },
        { key: "n_limit", label: "结构载荷因子", min: 2.0, max: 9.0, step: 0.1 }
      ];
    }

    function setupParamControls(results) {
      const defaults = extractDefaultParameters(results);
      state.parameters.defaults = { ...defaults };
      state.parameters.values = { ...defaults };
      state.paramInputs = {};
      ui.paramControls.innerHTML = "";
      const schema = getParamSchema(results);
      schema.forEach(p => {
        if (defaults[p.key] === null || defaults[p.key] === undefined) return;
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("span");
        label.className = "muted";
        label.textContent = p.label;
        const input = document.createElement("input");
        input.type = "number";
        input.min = String(p.min);
        input.max = String(p.max);
        input.step = String(p.step);
        input.value = String(defaults[p.key]);
        input.oninput = () => {
          updateParameterValue(p.key, parseFloat(input.value));
        };
        row.appendChild(label);
        row.appendChild(input);
        ui.paramControls.appendChild(row);
        state.paramInputs[p.key] = input;
      });
      renderParameterTable(results);
      validateParameters(results);
    }

    function updateParameterValue(key, value) {
      if (!Number.isFinite(value)) return;
      state.parameters.values[key] = value;
      syncResultsParameter(key, value);
      renderResults(state.results);
      renderParameterTable(state.results);
      validateParameters(state.results);
    }

    function renderParameterTable(results) {
      const schema = getParamSchema(results);
      const rows = schema
        .filter(p => state.parameters.values[p.key] !== null && state.parameters.values[p.key] !== undefined)
        .map(p => [p.key, p.label, fmt(state.parameters.values[p.key])]);
      renderTable(ui.tblParams, rows, ["字段", "说明", "值"]);
    }

    function validateParameters(results) {
      const schema = getParamSchema(results);
      const messages = [];
      schema.forEach(p => {
        const v = state.parameters.values[p.key];
        const input = state.paramInputs[p.key];
        if (v === null || v === undefined || !Number.isFinite(v)) return;
        let invalid = false;
        if (v < p.min || v > p.max) {
          messages.push(`${p.label} 超出范围 [${p.min}, ${p.max}]`);
          invalid = true;
        }
        if (p.key === "static_margin" && p.risk) {
          const r = p.risk;
          if (typeof r.red_low === "number" && v < r.red_low) messages.push(`${p.label} 低于红线 ${r.red_low}`);
          else if (typeof r.yellow_low === "number" && v < r.yellow_low) messages.push(`${p.label} 低于黄线 ${r.yellow_low}`);
          if (typeof r.yellow_high === "number" && v > r.yellow_high) messages.push(`${p.label} 高于黄线 ${r.yellow_high}`);
        }
        if (input) input.className = invalid ? "field-invalid" : "";
      });
      state.parameters.messages = messages;
      if (messages.length === 0) {
        ui.paramValidation.innerHTML = "<div class='validation-ok'>参数校验：通过</div>";
      } else {
        ui.paramValidation.innerHTML = "<div class='validation-warn'>参数校验：存在提示</div><div class='muted'>" + messages.join("<br/>") + "</div>";
      }
    }

    function applyCandidate(candidate) {
      if (!candidate) return;
      const map = {
        wing_loading_pa: candidate.wing_loading_pa,
        aspect_ratio: candidate.aspect_ratio,
        thrust_to_weight: candidate.thrust_to_weight
      };
      Object.keys(map).forEach(k => {
        const v = map[k];
        if (Number.isFinite(v)) {
          state.parameters.values[k] = v;
          syncResultsParameter(k, v);
          const input = state.paramInputs[k];
          if (input) input.value = String(v);
        }
      });
      renderResults(state.results);
      renderParameterTable(state.results);
      validateParameters(state.results);
    }

    function syncResultsParameter(key, value) {
      if (!state.results) return;
      if (key === "wing_loading_pa" || key === "aspect_ratio" || key === "thrust_to_weight") {
        if (!state.results.sizing || typeof state.results.sizing !== "object") state.results.sizing = {};
        state.results.sizing[key] = value;
        if (state.results.design_loop?.best_sizing) state.results.design_loop.best_sizing[key] = value;
        return;
      }
      if (key === "static_margin") {
        if (!state.results.stability || typeof state.results.stability !== "object") state.results.stability = {};
        state.results.stability.static_margin = value;
        return;
      }
      if (key === "n_limit") {
        if (!state.results.structures || typeof state.results.structures !== "object") state.results.structures = {};
        state.results.structures.n_limit = value;
      }
    }

    function normalizeRunBase(raw) {
      if (!raw) return "";
      let s = String(raw).trim();
      if (!s) return "";
      while (s.endsWith("/") || s.endsWith("\\")) s = s.slice(0, -1);
      return s;
    }

    function applyRunBase(base) {
      const prefix = `${base}/`;
      ui.pathResults.value = `${prefix}results/results.json`;
      ui.pathMesh.value = `${prefix}mesh/geometry_mesh.json`;
      ui.pathReport.value = `${prefix}report/report.md`;
      ui.pathConstraints.value = `${prefix}report/constraints_ws_tw.svg`;
      ui.pathAdvanced.value = `${prefix}geometry/advanced_shape_results.json`;
      ui.pathOpenvsp.value = `${prefix}openvsp/openvsp_advanced.py`;
    }

    function resolveRunBase() {
      let base = normalizeRunBase(ui.pathRun?.value || "");
      if (!base) {
        const params = new URLSearchParams(window.location.search);
        const runParam = params.get("run");
        if (runParam) {
          const normalized = runParam.includes("/") ? runParam : `./${runParam}`;
          base = normalizeRunBase(normalized);
          if (base && ui.pathRun) ui.pathRun.value = base;
        }
      }
      if (base) applyRunBase(base);
    }

    async function loadJsonFromPath(path) {
      try {
        const res = await fetch(path, { cache: "no-store" });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    async function loadJsonFromFile(file) {
      if (!file) return null;
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            resolve(JSON.parse(reader.result));
          } catch {
            resolve(null);
          }
        };
        reader.readAsText(file, "utf-8");
      });
    }

    async function loadAll() {
      setStatus("加载中…", false);
      resolveRunBase();
      const resPath = ui.pathResults.value.trim();
      const meshPath = ui.pathMesh.value.trim();
      const advancedPath = ui.pathAdvanced.value.trim();
      const openvspPath = ui.pathOpenvsp.value.trim();
      let results = await loadJsonFromPath(resPath);
      let mesh = await loadJsonFromPath(meshPath);
      let advanced = await loadJsonFromPath(advancedPath);
      if (!results && ui.fileResults.files[0]) results = await loadJsonFromFile(ui.fileResults.files[0]);
      if (!mesh && ui.fileMesh.files[0]) mesh = await loadJsonFromFile(ui.fileMesh.files[0]);
      if (!advanced && ui.fileAdvanced.files[0]) advanced = await loadJsonFromFile(ui.fileAdvanced.files[0]);

      if (!results) {
        setStatus("results.json 加载失败，可手动选择文件或确认路径", false);
      } else {
        state.results = results;
      }
      if (!mesh) {
        setStatus("geometry_mesh.json 加载失败，可手动选择文件或确认路径", false);
      } else {
        state.mesh = mesh;
      }
      state.advanced = advanced || null;
      state.advancedOriginal = advanced ? cloneJson(advanced) : null;
      state.advancedEditable = advanced ? buildEditableAdvanced(advanced) : null;
      state.geometryBaseline = getGeometryMetrics(state.advancedEditable?.inputs?.geometry_shape || null);
      state.geometryScale = { x: 1, y: 1, z: 1 };

      ui.linkReport.href = ui.pathReport.value.trim();
      ui.linkConstraints.href = ui.pathConstraints.value.trim();
      ui.linkOpenvsp.href = openvspPath;
      ui.openvspStatus.textContent = "";
      ui.geometryStatus.textContent = "";

      renderTargets(state.results);
      renderResults(state.results);
      renderCandidates(state.results);
      setupParamControls(state.results);
      setupGeometryControls(state.advancedEditable);
      updateGeometryScale();

      if (state.mesh && Array.isArray(state.mesh)) {
        const ok = await ensureThree();
        if (!ok) {
          setStatus("Three.js 加载失败", false);
          return;
        }
        buildScene(state.mesh);
        ensureRenderers();
        renderPartsList(state.mesh);
        setStatus("加载完成", true);
      }
    }

    function setupSectionToggles() {
      document.querySelectorAll('.section-header').forEach(header => {
        header.addEventListener('click', () => {
          const section = header.closest('.section');
          section.classList.toggle('collapsed');
        });
      });
    }

    function setupViewControls() {
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const view = btn.closest('.view');
          const viewType = view.dataset.view;
          const action = btn.dataset.action;
          
          switch (action) {
            case 'reset':
              resetCamera(viewType);
              break;
            case 'zoom-in':
              zoomCamera(viewType, 'in');
              break;
            case 'zoom-out':
              zoomCamera(viewType, 'out');
              break;
            case 'auto-rotate':
              toggleAutoRotate();
              break;
          }
        });
      });
    }

    ui.btnReload.onclick = loadAll;
    ui.btnApplyGeometry.onclick = () => {
      if (!state.advancedEditable) return;
      state.advanced = cloneJson(state.advancedEditable);
      state.geometryBaseline = getGeometryMetrics(state.advancedEditable?.inputs?.geometry_shape || null);
      updateGeometryScale();
      ui.geometryStatus.textContent = "已应用";
    };
    ui.btnResetGeometry.onclick = () => {
      if (!state.advancedOriginal) return;
      state.advancedEditable = buildEditableAdvanced(cloneJson(state.advancedOriginal));
      state.advanced = cloneJson(state.advancedOriginal);
      state.geometryBaseline = getGeometryMetrics(state.advancedEditable?.inputs?.geometry_shape || null);
      setupGeometryControls(state.advancedEditable);
      updateGeometryScale();
      ui.geometryStatus.textContent = "已恢复";
    };
    ui.btnDownloadGeometry.onclick = () => {
      const data = state.advancedEditable || state.advanced;
      if (!data) return;
      downloadJson(data, "advanced_shape_results.json");
      ui.geometryStatus.textContent = "已导出";
    };
    ui.btnOpenvsp.onclick = async () => {
      const openvspPath = ui.pathOpenvsp.value.trim();
      ui.openvspStatus.textContent = "下载中…";
      try {
        const res = await fetch(openvspPath, { cache: "no-store" });
        if (!res.ok) throw new Error("load_fail");
        const text = await res.text();
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "openvsp_advanced.py";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        ui.openvspStatus.textContent = "已下载";
      } catch {
        ui.openvspStatus.textContent = "下载失败";
      }
    };
    ui.btnResetParams.onclick = () => {
      const defaults = state.parameters.defaults || {};
      Object.keys(defaults).forEach(k => {
        const v = defaults[k];
        if (v === null || v === undefined) return;
        state.parameters.values[k] = v;
        syncResultsParameter(k, v);
        const input = state.paramInputs[k];
        if (input) input.value = String(v);
      });
      renderResults(state.results);
      renderParameterTable(state.results);
      validateParameters(state.results);
    };
    ui.toggleGrid.onchange = () => {
      applyTransforms();
      ui.btnToggleGrid.classList.toggle('active', ui.toggleGrid.checked);
    };
    ui.toggleWire.onchange = () => {
      applyTransforms();
      ui.btnToggleWire.classList.toggle('active', ui.toggleWire.checked);
    };
    ui.scale.oninput = () => {
      applyTransforms();
      ui.scaleValue.textContent = parseFloat(ui.scale.value).toFixed(2) + 'x';
    };
    ui.explode.oninput = () => {
      applyTransforms();
      ui.explodeValue.textContent = parseFloat(ui.explode.value).toFixed(1);
    };
    ui.btnResetAllViews.onclick = resetAllViews;
    ui.btnFitView.onclick = () => {
      fitCameras();
      Object.keys(state.cameraZoom).forEach(k => state.cameraZoom[k] = 1);
    };
    ui.btnToggleGrid.onclick = () => {
      ui.toggleGrid.checked = !ui.toggleGrid.checked;
      ui.toggleGrid.onchange();
    };
    ui.btnToggleWire.onclick = () => {
      ui.toggleWire.checked = !ui.toggleWire.checked;
      ui.toggleWire.onchange();
    };
    window.addEventListener("resize", updateRendererSize);

    setupSectionToggles();
    setupViewControls();
    loadAll();
  </script>
</body>
</html>
